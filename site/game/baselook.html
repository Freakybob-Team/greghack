<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseLook</title>
    <link rel="icon" type="image/x-icon" href="images/baselook.png">
    <style>
        * {
            font-family: "Open Sans", sans-serif;
        }
        h1, p, input, #isitreal {
            text-align: center;
        }
        body {
            background-color: white;
        }
        #searchdiv {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        #search {
            width: 200px;
            padding: 6px;
        }
        #searchsubmit {
            padding: 6px 12px;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <meta name="description" content="BaseLook: See Everything.">
    <meta content="BaseLook" property="og:title" />
    <meta content="BaseLook: See Everything." property="og:description" />
    <meta content="https://freakybob-team.github.io/greghack/game/baselook.html" property="og:url" />
    <meta content="https://freakybob-team.github.io/greghack/game/images/baselook.png" property="og:image" />
    <link rel="icon" type="image/x-icon" href="images/baselook.png">
</head>
<body>
    <header>
        <h1>BaseLook - See Everything.</h1>
    </header>
    <marquee>NOTICE: The KASH act is being enacted soon. We will enact these protections soon.</marquee>
    <p>Welcome to BaseLook, Guest.</p>
    <h1>Search</h1>
    <div id="searchdiv">
        <input type="search" id="search" autocomplete="off"></input>
        <button id="searchsubmit" onclick="searchsubmit()">Search!</button>
    </div>
    <div id="isitreal"></div>
    <script>
        function searchsubmit() {
            let user = document.getElementById("search").value;
            if (user === "bob" || user === "Bob") {
                isitreal.innerText = "User found! Sending you to " + user + "'s profile.";
                window.location.replace("baselook/bob.html");
            } else {
                isitreal.innerText = "User not found. Did they delete their account?";
            }
        }
    </script>
</body>
</html>
